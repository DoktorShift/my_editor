name: Tests

# Runs the test suite and the translation check for every pull request
# and every push to main and dev, on the three platforms the installers
# are built for, so a change that breaks one of them is seen before it
# is merged.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows' own platform, as people run it: the runner has a
          # desktop to draw on. Qt's offscreen platform finds no fonts on
          # Windows (it reads them from a folder Qt does not ship), so
          # text there is measured, wrapped and exported unlike in any
          # real window.
          - os: windows-latest
            name: windows
            qt_platform: windows
          # No screen on these runners: Qt draws into memory, with the
          # system's fonts.
          - os: macos-latest
            name: macos
            qt_platform: offscreen
          - os: ubuntu-22.04
            name: linux
            qt_platform: offscreen
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-test.lock

      # Enchant with an English and a German dictionary, so the tests of
      # the Linux spell checker run against the real library.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libenchant-2-2 hunspell-en-us hunspell-de-de

      # The exact versions a release ships (packaging/requirements-test.lock,
      # with hashes), plus the sidecar's packages so its tests run too.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r packaging/requirements-test.lock

      # A missing translation, or a placeholder that would crash a
      # window, fails here.
      - name: Check the translations
        run: python scripts/i18n.py check

      - name: Run the tests
        run: python -m pytest -q
