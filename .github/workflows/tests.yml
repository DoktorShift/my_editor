name: Tests

# Runs the test suite and the translation check for every pull request
# and every push to main and dev, on the three platforms the installers
# are built for, so a change that breaks one of them is seen before it
# is merged.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    env:
      # No screen on the runners: Qt draws into memory.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sidecar/requirements.txt

      # Enchant with an English and a German dictionary, so the tests of
      # the Linux spell checker run against the real library.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libenchant-2-2 hunspell-en-us hunspell-de-de

      # The sidecar's packages too, so its tests run instead of being skipped.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r sidecar/requirements.txt "pytest~=9.0"

      # A missing translation, or a placeholder that would crash a
      # window, fails here.
      - name: Check the translations
        run: python scripts/i18n.py check

      - name: Run the tests
        run: python -m pytest -q
